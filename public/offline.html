<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>You're offline</title>
    <style>
      :root { color-scheme: light dark; }
      body { margin: 0; min-height: 100dvh; display: grid; place-items: center; font: 15px/1.5 system-ui, sans-serif; background: #fff; color: #222; padding: env(safe-area-inset-top) 16px env(safe-area-inset-bottom); }
      @media (prefers-color-scheme: dark) { body { background: #0c0e15; color: #eceef3; } p { color: #a6a9b3; } }
      main { max-width: 320px; text-align: center; }
      h1 { font-size: 17px; margin: 0 0 4px; }
      p { margin: 0 0 16px; color: #666; }
      button { font: inherit; padding: 10px 16px; border-radius: 8px; border: 1px solid #ccc; background: transparent; color: inherit; min-height: 44px; }
    </style>
  </head>
  <body>
    <main>
      <h1>You're offline</h1>
      <p>This app needs a connection. Nothing you saved was lost.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
